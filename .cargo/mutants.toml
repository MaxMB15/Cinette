# Settings for cargo-mutants. See "Mutation testing" in docs/development.md.

exclude_re = [
    # The loopback server in mvp-core's http.rs only runs in tests. Changing it
    # tests the tests, not the app.
    "test_server::",
    # These only pass the real address and the shared client to a fetch_from
    # that the tests run against the loopback server. A test of the wrapper
    # itself would have to call the real service.
    "replace (fetch_source|fetch_whatson|fetch_mdblist) ",
    # mpv's OpenGL render context, which the macOS and Linux renderers share,
    # needs a real OpenGL context.
    'tauri-plugin-mpv/src/gl_render\.rs:',
    # The plugin's Linux renderer draws into a Wayland subsurface through GTK
    # and EGL, which the tests can't open. Its pure helpers stay in.
    'tauri-plugin-mpv/src/linux\.rs:.*(<impl (Drop|PlatformRenderer) for |(replace|in) egl\b|\b(gl_proc_address|DecorationWatch::\w+|LinuxGlRenderer::software_gl|request_render|follow_decorations|render_frame|recreate_egl_surface|build_wayland\w*|gl_renderer_name|wayland_egl_display|csd_offset|run_on_glib_main|drain_wayland_queue|mpv_uses_wayland)\b)',
    # Keeping the display awake goes through IOKit on macOS and D-Bus on
    # Linux. A test would change the machine's own sleep settings.
    'tauri-plugin-mpv/src/idle_inhibit\.rs:.*\b(IdleInhibitor::platform_\w+|cfstring|dbus_\w+)\b',
    # Loading a stream opens a video view, or mpv's own window, which needs a
    # real window. Tests call load_with with a fake renderer instead.
    'tauri-plugin-mpv/src/mpv\.rs:.*\bMpvState::(load|load_impl)\b',
    'tauri-plugin-mpv/src/commands\.rs:.*\bmpv_load\b',
    # Only iOS has a lock screen. Elsewhere these do nothing.
    'tauri-plugin-mpv/src/mpv\.rs:.*\bMpvState::(set_media_info|set_skip_intervals)\b',
    'tauri-plugin-mpv/src/commands\.rs:.*\bmpv_set_(media_info|skip_intervals)\b',
    # This sets the process's locale once. Test processes already run in the
    # C locale, so a test can't tell whether it ran.
    'tauri-plugin-mpv/src/lib\.rs:.*\bensure_c_locale\b',
    # The major and minor version use separate bits, so | and ^ give the same
    # number.
    'tauri-plugin-mpv/src/loadfile\.rs:.*replace \| with \^ in client_api_version',
    # Helpers in a test module that only builds on some platforms, such as
    # #[cfg(all(test, desktop))]. cargo-mutants only skips a plain
    # #[cfg(test)]. It doesn't apply this to a deleted struct field, so a
    # helper like that sets a field on a line of its own, not in a struct
    # update.
    '\btests::',
    # The app's entry point builds the whole Tauri app and opens its window.
    'src-tauri/src/lib\.rs:.*\b(run|show_main_window)\b',
    # Logging sets the process's one tracing subscriber and panic hook. The
    # iOS logger only builds for iOS.
    'src-tauri/src/logging\.rs:.*\b(init\b|log_panics\b|ios::)',
    # These ask the real service whether a key works. Settings calls them
    # when the user tests a key. The Gemini and OpenSubtitles ones stay in,
    # since a key that can't go in a header fails before anything is sent.
    # Gemini answers false for that key, so only the real service could
    # catch a change that always answers false.
    'replace (test_omdb_api_key|test_mdblist_api_key) ',
    'replace test_gemini_api_key -> Result<bool, String> with Ok\(false\)',
    # These make up a key where none is saved, or keep a blank one. The tests
    # that check OMDb, MDBList, OpenSubtitles, whatson and the skip databases
    # aren't asked without a key would then send their lookups to the real
    # services.
    'replace (omdb_api_key|saved_key|non_empty_key) -> .* with (Ok\()?Some\(',
    'replace trimmed_key -> .* with Some\("xyzzy"\)',
    'delete ! in non_empty_key',
    # Only differs on iOS, which the mutation runs don't build.
    'src-tauri/src/commands\.rs:.*\bensure_downloads_supported\b',
    # Starts caffeinate or systemd-inhibit, which would change the machine's
    # own sleep settings. The tests check the command it runs.
    'src-tauri/src/downloads/keep_awake\.rs:.*\bhold_while_running\b',
    # These bind remote control's real port and advertise this machine on the
    # network. The tests start the target on loopback with start_on instead.
    'src-tauri/src/remote/service\.rs:.*\b(start|advertise_on_network)\b',
    'src-tauri/src/remote/target\.rs:.*\bbind_default\b',
]

# Without --in-place, cargo-mutants copies the tree to build each mutant. This
# leaves out what git ignores, like node_modules and libs.
gitignore = true

# Mutation runs build on Linux, which never compiles the plugin's macOS and
# iOS renderers or the Android code. Their mutants would pass every
# test without being built.
exclude_globs = [
    "crates/tauri-plugin-mpv/src/macos.rs",
    "crates/tauri-plugin-mpv/src/ios.rs",
    "apps/player/src-tauri/src/android_device.rs",
    "apps/player/src-tauri/src/android_tls.rs",
    "crates/tauri-plugin-mpv/src/android.rs",
    # Bonjour discovery, likewise macOS only.
    "apps/player/src-tauri/src/discovery/macos.rs",
    # It only calls the library's run.
    "apps/player/src-tauri/src/main.rs",
]
