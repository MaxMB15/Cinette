[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/tauri-plugin-mpv",
    "apps/player/src-tauri",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tracing = "0.1"
thiserror = "2"
# No TLS backend here, because cargo features are additive and a workspace
# dependency can't differ by target. mvp-core picks one per target, so every
# crate that depends on it gets one. Crates add the other features they need
# on top.
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "system-proxy"] }
