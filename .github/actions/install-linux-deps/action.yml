name: Install Linux build dependencies
description: >-
  Install the apt packages the desktop app needs to build on Linux. The runner's
  Ubuntu mirror sometimes serves the ~160 MB download at ~100 kB/s, which added
  15-25 minutes to some builds, so the .deb files are cached between runs.

runs:
  using: composite
  steps:
    - name: Resolve apt packages
      id: apt
      shell: bash
      run: |
        set -euo pipefail
        packages=(
          libgtk-3-dev libwebkit2gtk-4.1-dev
          libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
          libayatana-appindicator3-dev
          libegl-dev libssl-dev pkg-config librsvg2-dev
          patchelf rpm
          meson ninja-build
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev
          libswresample-dev
          libass-dev libpulse-dev libasound2-dev
          libplacebo-dev libluajit-5.1-dev
          libx11-dev libxss-dev libxext-dev libxpresent-dev libxrandr-dev
          libwayland-dev
        )
        sudo apt-get update
        # The cache key is the list of .debs this install would download, so it
        # changes whenever Ubuntu publishes a new version of any of them.
        sudo apt-get install --print-uris -qq "${packages[@]}" | cut -d' ' -f2 | sort > "$RUNNER_TEMP/apt-debs.txt"
        echo "Downloads needed: $(wc -l < "$RUNNER_TEMP/apt-debs.txt") packages"
        {
          echo "packages=${packages[*]}"
          echo "prefix=apt-$ImageOS-"
          echo "key=apt-$ImageOS-$(sha256sum "$RUNNER_TEMP/apt-debs.txt" | cut -c1-16)"
        } >> "$GITHUB_OUTPUT"

    - name: Restore cached .deb files
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.apt.outputs.key }}
        restore-keys: ${{ steps.apt.outputs.prefix }}

    - name: Install apt packages
      shell: bash
      env:
        PACKAGES: ${{ steps.apt.outputs.packages }}
      run: |
        set -euo pipefail
        archives="$HOME/apt-archives"
        mkdir -p "$archives/partial"
        # apt only downloads the packages that aren't already in $archives. The
        # _apt user can't reach the home directory, so apt downloads as root anyway;
        # saying so up front stops it printing a warning about it.
        # shellcheck disable=SC2086 # PACKAGES is a space-separated list
        sudo apt-get install -y -o Dir::Cache::Archives="$archives" -o APT::Sandbox::User=root $PACKAGES
        # Keep only this install's .debs, so old versions don't pile up in the cache.
        sudo rm -rf "$archives/partial" "$archives/lock"
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        for deb in "$archives"/*.deb; do
          grep -qxF "$(basename "$deb")" "$RUNNER_TEMP/apt-debs.txt" || rm -f "$deb"
        done

    - name: Save .deb files to the cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.apt.outputs.key }}
