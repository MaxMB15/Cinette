name: Set up the frontend
description: >-
  Install pnpm at the version package.json's packageManager names, then Node,
  then the packages at their locked versions without running any install
  scripts, so no package code runs before the build.

runs:
  using: composite
  steps:
    # setup-node finds pnpm's store through pnpm, so pnpm goes first.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install packages
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
