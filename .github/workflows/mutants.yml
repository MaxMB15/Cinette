# Mutation testing for mvp-core with cargo-mutants. It makes small changes to
# the code, like flipping a comparison or returning a default, and runs the
# tests against each one. A change that no test notices points at code the
# tests run but don't check. A missed mutant is a result for the summary and
# fails nothing. Only an error, like a build that breaks, fails a job.
name: Mutation testing

on:
  # Only the lines a pull request changes.
  pull_request:
    branches: [dev]
    paths:
      - "crates/core/**"
      - ".github/workflows/mutants.yml"
      - "scripts/mutants-summary.py"
      - ".cargo/mutants.toml"
  # The whole crate once a week. Schedules run from the default branch, main,
  # so the start job below runs the workflow again on dev.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group, so the weekly start job doesn't cancel a
# manual run on main.
concurrency:
  group: mutants-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A mutant only needs a pass or a fail, so the test builds skip debug info.
  CARGO_PROFILE_DEV_DEBUG: none
  CARGO_MUTANTS_VERSION: 27.1.0

jobs:
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Each mutant takes about 7 seconds, so this fits a change that touches
    # most of the crate.
    timeout-minutes: 150
    steps:
      # A pull request checks out its merge into dev. The first parent is dev,
      # so the diff against it is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Without a changed Rust file there's nothing to mutate, so the job
      # skips the cache, the install and the build.
      - name: Find the changed Rust files
        id: changes
        run: |
          git diff HEAD^1 HEAD -- crates/core > pr.diff
          if grep -q '^+++ b/crates/core/.*\.rs$' pr.diff; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            printf '## Mutation testing\n\nThis pull request changes no Rust code in mvp-core.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Rust
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: mutants
          save-if: false

      - name: Install cargo-mutants
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}

      # cargo-mutants exits with 2 when a mutant survives and 3 when one times
      # out. Those are results for the summary, so only other codes fail.
      # --in-place mutates the checkout itself, which reuses the cached build.
      # When the changed lines hold no mutants, such as a change that only adds
      # tests, it exits with 0 and writes no results.
      - name: Test mutants in the changed lines
        if: steps.changes.outputs.rust == 'true'
        run: |
          code=0
          cargo mutants --in-place -p mvp-core --in-diff pr.diff || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi
          if [ ! -f mutants.out/outcomes.json ]; then
            printf '## Mutation testing\n\nThe changed lines have nothing to mutate.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write the summary
        if: ${{ !cancelled() && hashFiles('mutants.out/outcomes.json') != '' }}
        run: python3 scripts/mutants-summary.py mutants.out >> "$GITHUB_STEP_SUMMARY"

  # The weekly run starts a manual run on dev, which tests the newest code.
  # Every job of that run checks out the commit dev was at when it started, and
  # it saves the cache where pull requests to dev can restore it.
  start:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the full run on dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mutants.yml --repo "$GITHUB_REPOSITORY" --ref dev

  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # Only a run on dev saves, from one shard, since the shards build the
      # same thing.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: mutants
          save-if: ${{ github.ref == 'refs/heads/dev' && matrix.shard == 0 }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}

      - name: Test shard ${{ matrix.shard }} of the mutants
        run: |
          code=0
          cargo mutants --in-place -p mvp-core --shard ${{ matrix.shard }}/4 --output shard || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      # The logs hold each mutant's build and test output, which is most of
      # the size. diff/ still shows what each mutant changed.
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            shard/mutants.out/
            !shard/mutants.out/log/
          retention-days: 30

  report:
    needs: full
    if: ${{ !cancelled() && needs.full.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Download the shards
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: mutants-shard-*
          path: shards

      # Each shard is named, so one that uploaded nothing shows up in the
      # summary under "No results in" instead of dropping out of the totals.
      - name: Write the summary
        run: |
          python3 scripts/mutants-summary.py shards/mutants-shard-0 shards/mutants-shard-1 \
            shards/mutants-shard-2 shards/mutants-shard-3 >> "$GITHUB_STEP_SUMMARY"
