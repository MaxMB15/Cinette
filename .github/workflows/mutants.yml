# Mutation testing for the Rust crates with cargo-mutants. It makes small
# changes to the code, like flipping a comparison or returning a default, and
# runs the tests against each one. A change that no test notices points at code
# the tests run but don't check. Here a missed mutant is a result for the
# summary and fails nothing. Only an error, like a build that breaks, fails a
# job. The Changed code workflow, changed-code.yml, checks the lines a pull
# request changes, and fails on a missed mutant there.
name: Mutation testing

on:
  # Every crate once a week. Schedules run from the default branch, main, so
  # the start job below runs the workflow again on dev.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      package:
        description: Crate to test
        type: choice
        default: all
        options:
          - all
          - mvp-core
          - tauri-plugin-mpv
          - max-video-player

permissions:
  contents: read

# The event is part of the group, so the weekly start job doesn't cancel a
# manual run on main. The run it starts on dev does cancel an older manual run
# of every crate there, since both test the same branch. A manual run of one
# crate only cancels an older run of the same crate.
concurrency:
  group: mutants-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A mutant only needs a pass or a fail, so the test builds skip debug info.
  CARGO_PROFILE_DEV_DEBUG: none
  CARGO_MUTANTS_VERSION: 27.1.0
  # The plugin links libmpv, and the app also links GTK and WebKitGTK. These
  # are the packages the test-system-libmpv job in build.yml installs.
  APT_PACKAGES: >-
    libmpv-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
    libsoup-3.0-dev libegl-dev libwayland-dev libssl-dev pkg-config

jobs:
  # The weekly run starts a manual run on dev, which tests the newest code.
  # Every job of that run checks out the commit dev was at when it started, and
  # it saves the caches where pull requests to dev can restore them.
  start:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the full run on dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mutants.yml --repo "$GITHUB_REPOSITORY" --ref dev -f package=all

  # Lists a job for each shard of each crate the run tests. The app's mutants
  # take the longest to build and test, so it gets the most shards.
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: List the shards
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          matrix=$(jq -cn --arg only "$PACKAGE" '
            [ {package: "mvp-core", shards: 4},
              {package: "tauri-plugin-mpv", shards: 4},
              {package: "max-video-player", shards: 8} ]
            | map(select($only == "all" or .package == $only))
            | {include: [.[] | .package as $p | .shards as $n
                | range($n) | {package: $p, shard: ., shards: $n}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # The app's tests run the real ffmpeg sidecar. This job downloads it once for
  # all of the app's shards, so its host sees one download a run, not eight.
  sidecar:
    needs: plan
    if: contains(needs.plan.outputs.matrix, 'max-video-player')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # fetch-ffmpeg.sh asks rustc for the target name.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # Fails when the pinned build doesn't download, rather than building
      # ffmpeg from source.
      - name: Fetch the ffmpeg sidecar
        env:
          FFMPEG_PINNED_ONLY: "1"
        run: ./scripts/fetch-ffmpeg.sh linux

      - name: Upload the sidecar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-sidecar
          path: apps/player/src-tauri/binaries/
          retention-days: 1

  # A run without the app skips the sidecar job, which would skip this one too
  # without the check here. When the sidecar fails, the app's shards fail at
  # its download, their first step after the checkout, and the other crates
  # still run.
  full:
    name: full (${{ matrix.package }}, ${{ matrix.shard }})
    needs: [plan, sidecar]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PACKAGE: ${{ matrix.package }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the ffmpeg sidecar
        if: matrix.package == 'max-video-player'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ffmpeg-sidecar
          path: apps/player/src-tauri/binaries

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # The repo's caches are close to GitHub's 10 GB limit, so the crates
      # share one. Only a run on dev saves it, from the app's first shard. The
      # app builds most of what the plugin and mvp-core build.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: mutants-all
          save-if: ${{ github.ref == 'refs/heads/dev' && matrix.package == 'max-video-player' && matrix.shard == 0 }}

      - name: Install system libraries
        if: matrix.package != 'mvp-core'
        run: |
          # $APT_PACKAGES is a list of names, so it's split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update && sudo apt-get install -y $APT_PACKAGES

      - name: Set up the frontend
        if: matrix.package == 'max-video-player'
        uses: ./.github/actions/setup-frontend

      # An artifact doesn't keep the sidecar's executable bit.
      - name: Build the frontend
        if: matrix.package == 'max-video-player'
        run: |
          chmod +x apps/player/src-tauri/binaries/*
          pnpm run build:desktop

      - name: Install cargo-mutants
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}

      # Each shard writes to a folder named after its crate and number, so the
      # report can download them all into one place.
      - name: Test shard ${{ matrix.shard }} of ${{ matrix.package }}
        run: |
          out="results/mutants-$PACKAGE-shard-$SHARD"
          mkdir -p "$out"
          code=0
          cargo mutants --in-place -p "$PACKAGE" --shard "$SHARD/$SHARDS" --output "$out" || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      # The logs hold each mutant's build and test output, which is most of
      # the size. diff/ still shows what each mutant changed.
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-${{ matrix.package }}-shard-${{ matrix.shard }}
          path: |
            results/
            !results/*/mutants.out/log/
          retention-days: 30

  report:
    needs: [plan, full]
    if: ${{ !cancelled() && needs.full.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # Each artifact holds one mutants-<crate>-shard-N folder. Merging them
      # gives the same layout however many shards uploaded, where a lone
      # artifact would otherwise land in shards/ itself.
      - name: Download the shards
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: mutants-*-shard-*
          path: shards
          merge-multiple: true

      # One section for each crate the plan lists. Every shard in the plan is
      # named, so one that uploaded nothing shows up under "No results in"
      # instead of dropping out of the totals.
      - name: Write the summary
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          for package in $(jq -r '[.include[].package] | unique[]' <<< "$MATRIX"); do
            mapfile -t folders < <(jq -r --arg p "$package" \
              '.include[] | select(.package == $p) | "shards/mutants-\($p)-shard-\(.shard)/mutants.out"' <<< "$MATRIX")
            python3 scripts/mutants-summary.py --title "Mutants in $package" "${folders[@]}" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
