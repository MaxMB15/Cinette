name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A tag pushed again while its release is still building waits for that run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The updater signing key is only given to the steps that check it and sign with
# it, so nothing else, such as a package's install script, can read it.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Create the draft release before platform builds so parallel jobs can upload without racing
  # ("release not found" when Linux finished before macOS ran gh release create).
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create draft GitHub release (if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('apps/player/src-tauri/tauri.conf.json'))['version'])")
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release v${VERSION} already exists; skipping create."
          else
            gh release create "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Cinette v${VERSION}" \
              --notes "See the [CHANGELOG](https://github.com/MaxMB15/Cinette/blob/main/CHANGELOG.md) for details." \
              --draft
          fi

  # One build for each CPU. build-macos and build-macos-intel in build.yml
  # build the same way, and save the Rust caches these restore.
  release-macos:
    name: release-macos (${{ matrix.arch }})
    needs: [prepare-release]
    strategy:
      # Each CPU's build carries on when the other fails.
      fail-fast: false
      matrix:
        include:
          # Pinned: the bundle ships Homebrew dylibs, which require the
          # runner's macOS version. macos-latest moved to macOS 26 and v0.5.0
          # stopped launching on 15.
          - arch: aarch64
            runner: macos-15
            cache: desktop-macos
          # Libraries from MacPorts, since Homebrew stopped building bottles
          # for Intel Macs. Tauri names the Intel build x64.
          - arch: x64
            runner: macos-15-intel
            cache: desktop-macos-x64
    runs-on: ${{ matrix.runner }}
    # The Apple signing secrets live in this environment, which waits for a
    # reviewer to approve the job before it starts.
    environment: macos-signing
    env:
      CARGO_HOME: /Users/runner/.cargo
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail before the build, not after it, when the secret is missing or
      # malformed.
      - name: Check the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/sign-updater.py --check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          # build.yml saves this cache on main. A cache saved from a tag can only be
          # used by that same tag, so saving here would just take up space.
          shared-key: ${{ matrix.cache }}
          save-if: false

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install system deps
        uses: ./.github/actions/install-macos-deps

      - name: Build libmpv
        run: ./scripts/build-libmpv.sh macos

      - name: Fetch ffmpeg sidecar (used for offline downloads)
        # A release ships only the pinned build, never one made on the runner.
        env:
          FFMPEG_PINNED_ONLY: "1"
        run: ./scripts/fetch-ffmpeg.sh macos

      - name: Set up Developer ID signing
        id: apple
        # Tauri signs and notarizes the app during the build when these secrets are
        # set. Without them the release is built unsigned, as before.
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Build Tauri app
        # Builds without updater artifacts, which are made below, and tries a
        # failed build once more. The script says why.
        run: ./scripts/build-app.sh

      - name: Start the app
        run: ./scripts/smoke-test-macos-app.sh target/release/bundle/macos/*.app

      - name: Notarize the DMG
        if: steps.apple.outputs.notarizing == 'true'
        run: ./scripts/notarize-macos.sh target/release/bundle/dmg/*.dmg

      - name: Verify signing
        if: steps.apple.outputs.signing == 'true'
        run: >-
          ./scripts/verify-macos-signing.sh
          ${{ steps.apple.outputs.notarizing == 'true' && '--notarized' || '' }}
          target/release/bundle/macos/*.app target/release/bundle/dmg/*.dmg

      - name: Create updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('apps/player/src-tauri/tauri.conf.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The bundler names the app and the DMG after productName, as
          # "Cinette.app" and "Cinette_<v>_<arch>.dmg".
          PRODUCT_NAME=$(python3 -c "import json; print(json.load(open('apps/player/src-tauri/tauri.conf.json'))['productName'])")
          echo "PRODUCT_NAME=$PRODUCT_NAME" >> "$GITHUB_ENV"

          BUNDLE_DIR="target/release/bundle/macos"
          UPDATER="$BUNDLE_DIR/Cinette.app.tar.gz"

          # Create the .tar.gz updater archive from the built .app
          tar czf "$UPDATER" -C "$BUNDLE_DIR" "${PRODUCT_NAME}.app"
          python3 scripts/sign-updater.py "$UPDATER"

      - name: Upload macOS updater signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-updater-sig-${{ matrix.arch }}
          path: target/release/bundle/macos/Cinette.app.tar.gz.sig

      - name: Upload macOS assets to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          DMG_BUILT="target/release/bundle/dmg/${PRODUCT_NAME}_${VERSION}_${ARCH}.dmg"
          if [[ ! -f "$DMG_BUILT" ]]; then
            echo "::error::The build made no $DMG_BUILT. It made: $(ls target/release/bundle/dmg)"
            exit 1
          fi
          # No version in the name, so the README's releases/latest/download link
          # always points at the newest DMG.
          DMG="target/release/bundle/dmg/Cinette_${ARCH}.dmg"
          UPDATER="target/release/bundle/macos/Cinette.app.tar.gz"
          UPDATER_VERSIONED="target/release/bundle/macos/Cinette_${VERSION}_${ARCH}.app.tar.gz"

          cp "$DMG_BUILT" "$DMG"

          # Rename updater files so the download URL matches what latest.json expects
          cp "$UPDATER" "$UPDATER_VERSIONED"
          cp "${UPDATER}.sig" "${UPDATER_VERSIONED}.sig"

          gh release upload "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$DMG" \
            "$UPDATER_VERSIONED" \
            "${UPDATER_VERSIONED}.sig"

  release-linux:
    needs: [prepare-release]
    # A binary can need the glibc of the Ubuntu that built it, and the .deb and
    # .rpm declare no minimum glibc. Built on a newer Ubuntu, they'd install on
    # older systems and then fail to start. build-linux in build.yml uses the same
    # Ubuntu and shares this job's Rust cache, so change both together.
    runs-on: ubuntu-24.04
    env:
      CARGO_HOME: /home/runner/.cargo
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail before the build, not after it, when the secret is missing or
      # malformed.
      - name: Check the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/sign-updater.py --check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          # build.yml saves this cache on main. A cache saved from a tag can only be
          # used by that same tag, so saving here would just take up space.
          shared-key: desktop-linux
          save-if: false

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install system deps
        uses: ./.github/actions/install-linux-deps

      - name: Build libmpv from source
        run: |
          ./scripts/build-libmpv.sh linux
          echo "LD_LIBRARY_PATH=$(pwd)/libs/linux:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Fetch ffmpeg sidecar (used for offline downloads)
        # A release ships only the pinned build, never one made on the runner.
        env:
          FFMPEG_PINNED_ONLY: "1"
        run: ./scripts/fetch-ffmpeg.sh linux

      - name: Build Tauri app
        run: ./scripts/build-app.sh

      - name: Create updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('apps/player/src-tauri/tauri.conf.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          BUNDLE_DIR="target/release/bundle"

          # The bundler puts the version in each file name. Rename the files to
          # names without one, so the README's releases/latest/download links
          # always point at the newest packages. latest.json links to them by
          # tag. The deb and rpm packages are named "cinette", productName in
          # kebab case, and tauri.conf.json makes them replace the
          # "max-video-player" package that releases before the rename made.
          shopt -s nullglob
          for f in "$BUNDLE_DIR"/deb/*.deb; do
            mv "$f" "$BUNDLE_DIR/deb/Cinette_amd64.deb"
          done
          for f in "$BUNDLE_DIR"/rpm/*.rpm; do
            mv "$f" "$BUNDLE_DIR/rpm/Cinette_x86_64.rpm"
          done
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            mv "$f" "$BUNDLE_DIR/appimage/Cinette_amd64.AppImage"
          done
          shopt -u nullglob

          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" | head -1)

          if [[ -n "$APPIMAGE" ]]; then
            UPDATER="$BUNDLE_DIR/Cinette_linux.tar.gz"
            tar czf "$UPDATER" -C "$(dirname "$APPIMAGE")" "$(basename "$APPIMAGE")"
            python3 scripts/sign-updater.py "$UPDATER"
          fi

      - name: Upload Linux updater signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-updater-sig
          path: target/release/bundle/Cinette_linux.tar.gz.sig
          if-no-files-found: warn

      - name: Publish to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/release/bundle"

          # Collect all Linux artifacts
          ARTIFACTS=()
          for deb in "$BUNDLE_DIR"/deb/*.deb; do
            [[ -f "$deb" ]] && ARTIFACTS+=("$deb")
          done
          for rpm in "$BUNDLE_DIR"/rpm/*.rpm; do
            [[ -f "$rpm" ]] && ARTIFACTS+=("$rpm")
          done
          for appimage in "$BUNDLE_DIR"/appimage/*.AppImage; do
            [[ -f "$appimage" ]] && ARTIFACTS+=("$appimage")
          done
          # Include updater tar.gz if it exists
          UPDATER="$BUNDLE_DIR/Cinette_linux.tar.gz"
          if [[ -f "$UPDATER" ]]; then
            ARTIFACTS+=("$UPDATER")
            [[ -f "${UPDATER}.sig" ]] && ARTIFACTS+=("${UPDATER}.sig")
          fi

          # Upload to draft release (created by prepare-release job before builds)
          if [[ ${#ARTIFACTS[@]} -eq 0 ]]; then
            echo "::error::No Linux artifacts found under $BUNDLE_DIR (deb/rpm/appimage)."
            exit 1
          fi
          for artifact in "${ARTIFACTS[@]}"; do
            gh release upload "v${VERSION}" "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done

  # The APKs for the GitHub release, one for each ARM CPU. They update
  # themselves from latest.json, so each is signed with the same key every
  # time; Android only installs an update signed like the app it replaces.
  # Google Play and the Amazon Appstore builds are uploaded by hand. See
  # docs/android.md.
  release-android:
    needs: [prepare-release]
    runs-on: ubuntu-24.04
    # A tag only restores caches saved on main, which rarely has libmpv for
    # Android, and building it takes about 20 minutes for each CPU.
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail before the build, not after it, when a secret is missing or
      # doesn't open the key. Only this step and the one that signs get the
      # key, so nothing the build runs, such as a package's install script,
      # can read it.
      - name: Check the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets. See docs/releasing.md."
              exit 1
            fi
          done
          KEYSTORE_FILE=$(mktemp)
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          base64 --decode <<< "$KEYSTORE" > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null

      - name: Set up the Android build
        uses: ./.github/actions/setup-android

      # One APK for each CPU, which keeps each one smaller than the two
      # together. There's no gen/android/keystore.properties, so they come
      # out unsigned.
      - name: Build the APKs
        working-directory: apps/player
        run: |
          set -euo pipefail
          . ../../scripts/android-env.sh
          ORG_GRADLE_PROJECT_store=github pnpm tauri android build --target aarch64 --target armv7 --apk --split-per-abi --ci

      # zipalign -P 16 keeps the native libraries on 16 KB boundaries, which
      # devices with 16 KB memory pages need.
      - name: Sign the APKs
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          KEYSTORE_FILE=$(mktemp)
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          base64 --decode <<< "$KEYSTORE" > "$KEYSTORE_FILE"
          OUT=apps/player/src-tauri/gen/android/app/build/outputs/apk
          mkdir -p "$RUNNER_TEMP/apk"
          # Gradle names each APK after its flavor, Android after its ABI. No
          # version in the names, so releases/latest/download links always
          # point at the newest APKs. latest.json links to them by tag.
          for pair in arm64:arm64-v8a arm:armeabi-v7a; do
            flavor=${pair%%:*}
            abi=${pair#*:}
            "$BUILD_TOOLS/zipalign" -f -P 16 4 \
              "$OUT/$flavor/release/app-$flavor-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_FILE" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --v4-signing-enabled false \
              --out "$RUNNER_TEMP/apk/Cinette_$abi.apk" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/apk/Cinette_$abi.apk"
          done

      - name: Upload the APKs to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('apps/player/src-tauri/tauri.conf.json'))['version'])")
          gh release upload "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$RUNNER_TEMP/apk/Cinette_arm64-v8a.apk" \
            "$RUNNER_TEMP/apk/Cinette_armeabi-v7a.apk"

  # ── Publish latest.json (depends on every platform job) ───────────────
  # A failed Android build leaves its APKs out rather than holding back the
  # computers' update, and the Android apps then see no update.
  publish-latest-json:
    runs-on: ubuntu-latest
    needs: [release-macos, release-linux, release-android]
    if: ${{ !cancelled() && needs.release-macos.result == 'success' && needs.release-linux.result == 'success' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download updater signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sigs

      - name: Build and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_BUILT: ${{ needs.release-android.result == 'success' }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('apps/player/src-tauri/tauri.conf.json'))['version'])")

          MACOS_SIG=""
          if [[ -f sigs/macos-updater-sig-aarch64/Cinette.app.tar.gz.sig ]]; then
            MACOS_SIG=$(cat sigs/macos-updater-sig-aarch64/Cinette.app.tar.gz.sig)
          fi

          MACOS_INTEL_SIG=""
          if [[ -f sigs/macos-updater-sig-x64/Cinette.app.tar.gz.sig ]]; then
            MACOS_INTEL_SIG=$(cat sigs/macos-updater-sig-x64/Cinette.app.tar.gz.sig)
          fi

          LINUX_SIG=""
          if [[ -f sigs/linux-updater-sig/Cinette_linux.tar.gz.sig ]]; then
            LINUX_SIG=$(cat sigs/linux-updater-sig/Cinette_linux.tar.gz.sig)
          fi

          python3 - "$VERSION" "$MACOS_SIG" "$MACOS_INTEL_SIG" "$LINUX_SIG" "$ANDROID_BUILT" << 'PYEOF'
          import json, sys
          from datetime import datetime, timezone
          version, macos_sig, macos_intel_sig, linux_sig, android_built = sys.argv[1:6]
          platforms = {}
          if macos_sig:
              platforms["darwin-aarch64"] = {
                  "signature": macos_sig,
                  "url": f"https://github.com/MaxMB15/Cinette/releases/download/v{version}/Cinette_{version}_aarch64.app.tar.gz"
              }
          if macos_intel_sig:
              platforms["darwin-x86_64"] = {
                  "signature": macos_intel_sig,
                  "url": f"https://github.com/MaxMB15/Cinette/releases/download/v{version}/Cinette_{version}_x64.app.tar.gz"
              }
          if linux_sig:
              platforms["linux-x86_64"] = {
                  "signature": linux_sig,
                  "url": f"https://github.com/MaxMB15/Cinette/releases/download/v{version}/Cinette_linux.tar.gz"
              }
          base_url = f"https://github.com/MaxMB15/Cinette/releases/download/v{version}"
          packages = {
              "linux-deb-x86_64": f"{base_url}/Cinette_amd64.deb",
              "linux-rpm-x86_64": f"{base_url}/Cinette_x86_64.rpm",
          }
          # The keys check_android_update in commands.rs looks up.
          if android_built == "true":
              packages["android-arm64-v8a"] = f"{base_url}/Cinette_arm64-v8a.apk"
              packages["android-armeabi-v7a"] = f"{base_url}/Cinette_armeabi-v7a.apk"
          data = {
              "version": version,
              "notes": "See the CHANGELOG for details.",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
              "packages": packages
          }
          with open("latest.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"latest.json written with platforms: {list(platforms.keys())}")
          PYEOF

          gh release upload "v${VERSION}" latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # ── Sync main back to dev after release ─────────────────────────────────
  sync-dev:
    runs-on: ubuntu-latest
    needs: [publish-latest-json]
    if: always() && needs.publish-latest-json.result == 'success'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_PAT || github.token }}
        run: |
          set -euo pipefail

          # Check if dev branch exists before fetching (fetch fails if branch is missing)
          if ! git ls-remote --heads origin dev | grep -q .; then
            echo "::notice::No dev branch found — skipping sync."
            exit 0
          fi

          git fetch origin main dev

          git checkout dev
          git reset --hard origin/dev

          # Check if main has anything new for dev
          AHEAD=$(git rev-list --count origin/dev..origin/main)
          if [ "$AHEAD" = "0" ]; then
            echo "dev is already up to date with main."
            exit 0
          fi

          # Try fast-forward merge first, fall back to merge commit
          if git merge origin/main --ff-only 2>/dev/null; then
            echo "Fast-forwarded dev to main."
            git push origin dev
          elif git merge origin/main --no-edit -m "chore: sync main back to dev after release"; then
            echo "Merged main into dev (merge commit)."
            git push origin dev
          else
            echo "::warning::Auto-merge of main into dev failed (conflicts). Creating PR instead."
            # Create a PR for manual resolution
            BRANCH="chore/sync-main-to-dev-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
            git merge --abort || true
            git checkout -b "$BRANCH" origin/main
            git push -u origin "$BRANCH"
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "chore: sync main back to dev after release" \
              --body "Automated post-release sync. Main has changes (version bump + release tag) that need to be merged back into dev. Resolve any conflicts and merge."
          fi

      - name: Summary
        run: echo "### main synced back to dev" >> "$GITHUB_STEP_SUMMARY"
