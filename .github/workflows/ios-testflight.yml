name: iOS TestFlight

# Builds the iOS app for the App Store and uploads it to TestFlight. Run it by
# hand. The Apple secrets live in the macos-signing environment, which waits
# for approval and only runs on dev, main and v* tags. The users listed in
# RELEASE_ALLOWED_ACTORS can start it. When that variable isn't set, only the
# repository owner can. Setting it replaces the owner, so list the owner too.
on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs before anything can read the signing secrets. The macos-signing
  # environment also refuses other refs, so this is a second check.
  authorize:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      attempt: ${{ steps.check.outputs.attempt }}
    steps:
      - name: Check the ref and who started the run
        id: check
        env:
          REF: ${{ github.ref }}
          ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          ALLOWED_ACTORS: ${{ vars.RELEASE_ALLOWED_ACTORS }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/dev | refs/heads/main | refs/tags/v*) ;;
            *)
              echo "::error::TestFlight builds only run from dev, main or a v* tag, not $REF."
              exit 1
              ;;
          esac
          # The release workflows use the same rule. The comma-separated users
          # in RELEASE_ALLOWED_ACTORS can start a run, or the repository owner
          # when that variable isn't set.
          allowed="$(tr -d '[:space:]' <<<"$ALLOWED_ACTORS")"
          allowed="${allowed:-$REPO_OWNER}"
          if ! tr ',' '\n' <<<"$allowed" | grep -qxF "$ACTOR"; then
            echo "::error::$ACTOR can't run TestFlight builds. Allowed: $allowed. Set the RELEASE_ALLOWED_ACTORS variable to change this."
            exit 1
          fi
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  testflight:
    needs: authorize
    runs-on: macos-26
    timeout-minutes: 90
    environment: macos-signing
    permissions:
      contents: read
    steps:
      # Re-running only this job skips the authorize job, which passed in an
      # earlier attempt and checked someone else. Then the rerun has to come
      # from whoever started the run.
      - name: Check who started this attempt
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CHECKED_ATTEMPT: ${{ needs.authorize.outputs.attempt }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$CHECKED_ATTEMPT" != "$ATTEMPT" ] && [ "$TRIGGERING_ACTOR" != "$ACTOR" ]; then
            echo "::error::$ACTOR started this run, so only $ACTOR can re-run this job on its own. Re-run all jobs or start a new run instead."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ios-device

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # The upload always needs the App Store Connect API key. Signing uses the
      # Apple Distribution certificate and App Store profile when they're set.
      # Otherwise Tauri gets the API key, skips signing during the build and
      # lets Xcode sign the export with cloud-managed certificates.
      - name: Set up signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY_ID" || -z "$API_ISSUER" || -z "$API_PRIVATE_KEY" ]]; then
            echo "::error::Uploading to TestFlight needs APPLE_API_KEY_ID, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY."
            exit 1
          fi
          keys="$RUNNER_TEMP/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$API_PRIVATE_KEY" > "$keys/AuthKey_$API_KEY_ID.p8"
          # altool looks for AuthKey_<id>.p8 in this folder.
          echo "API_PRIVATE_KEYS_DIR=$keys" >> "$GITHUB_ENV"

          if [[ -z "$IOS_CERTIFICATE$IOS_CERTIFICATE_PASSWORD$IOS_MOBILE_PROVISION" ]]; then
            echo "::notice::IOS_CERTIFICATE is not set, so Xcode signs through the API key."
            # Tauri passes these to xcodebuild as -authenticationKey* options.
            {
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$keys/AuthKey_$API_KEY_ID.p8"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ -z "$IOS_CERTIFICATE" || -z "$IOS_CERTIFICATE_PASSWORD" || -z "$IOS_MOBILE_PROVISION" ]]; then
            echo "::error::Signing with a certificate needs all three of IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD and IOS_MOBILE_PROVISION."
            exit 1
          fi
          # Tauri imports the certificate into a temporary keychain, installs
          # the profile and switches the project to manual signing. It treats
          # an empty variable as set, so these are only exported here. Line
          # breaks in the base64 would break the GITHUB_ENV file.
          {
            echo "IOS_CERTIFICATE=$(printf '%s' "$IOS_CERTIFICATE" | tr -d '[:space:]')"
            echo "IOS_CERTIFICATE_PASSWORD=$IOS_CERTIFICATE_PASSWORD"
            echo "IOS_MOBILE_PROVISION=$(printf '%s' "$IOS_MOBILE_PROVISION" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"

      # App Store Connect takes at most three numbers in CFBundleVersion, and
      # --build-number would append a fourth to the app version. The run
      # number goes up with every run, which TestFlight needs.
      - name: Build for the App Store
        working-directory: apps/desktop
        run: >-
          npx tauri ios build --target aarch64 --export-method app-store-connect --ci
          --config '{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          ipa=$(find apps/desktop/src-tauri/gen/apple/build -name '*.ipa' -print -quit)
          if [[ -z "$ipa" ]]; then
            echo "::error::The build didn't produce an .ipa."
            exit 1
          fi
          echo "Uploading $ipa"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
