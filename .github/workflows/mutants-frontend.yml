# Mutation testing for the frontend helpers in apps/player/src/lib with
# StrykerJS. Like mutants.yml does for the Rust code, it makes small changes
# to the code and runs the tests that reach each one. The weekly and manual
# runs of all of src/lib list the changes no test notices in the summary, and
# fail only on an error, like a first test run that fails. The plan job
# splits src/lib into shards, as the Changed code workflow, changed-code.yml,
# does for the lines a pull request changes. Nothing goes to Stryker's
# dashboard. Each shard's report is only kept as an artifact of the run.
name: Frontend mutation testing

on:
  # All of src/lib once a week. Schedules run from the default branch, main,
  # so the start job below runs the workflow again on dev.
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group, so the weekly start job doesn't cancel a
# manual run on main.
concurrency:
  group: mutants-frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The files in src/lib that stryker.config.mjs's mutate globs give, in
  # shards of about 1,500 lines.
  plan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Split src/lib into shards
        id: plan
        run: python3 scripts/changed-code.py stryker --all --output "$GITHUB_OUTPUT"

  mutants:
    name: mutants (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    # A shard takes about 20 minutes here, testing 4 mutants at once, one for
    # each of the runner's cores.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MUTATE: ${{ matrix.mutate }}
      TITLE: Frontend mutation testing${{ matrix.shards > 1 && format(', shard {0} of {1}', matrix.shard, matrix.shards) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      # The old report goes first, so the steps below never read one this run
      # didn't write.
      - name: Test the mutants
        id: stryker
        working-directory: apps/player
        run: |
          rm -rf reports/mutation
          pnpm exec stryker run --mutate "$MUTATE"

      - name: Write the summary
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/stryker-summary.py --title "$TITLE" \
            apps/player/reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"

      # The HTML report shows each mutant in its source file, and the JSON
      # report is what the summary reads.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-report-shard-${{ matrix.shard }}
          path: apps/player/reports/mutation/
          if-no-files-found: ignore
          retention-days: 30

  # The weekly run starts a manual run on dev, which tests the newest code.
  start:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the full run on dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mutants-frontend.yml --repo "$GITHUB_REPOSITORY" --ref dev
