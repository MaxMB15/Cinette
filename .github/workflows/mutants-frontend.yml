# Mutation testing for the frontend helpers in apps/player/src/lib with
# StrykerJS. Like mutants.yml does for the Rust code, it makes small changes
# to the code and runs the tests that reach each one. The weekly and manual
# runs of all of src/lib list the changes no test notices in the summary, and
# fail only on an error, like a first test run that fails. The Changed code
# workflow, changed-code.yml, checks the lines a pull request changes. Nothing
# goes to Stryker's dashboard. The report is only kept as an artifact of the
# run.
name: Frontend mutation testing

on:
  # All of src/lib once a week. Schedules run from the default branch, main,
  # so the start job below runs the workflow again on dev.
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group, so the weekly start job doesn't cancel a
# manual run on main.
concurrency:
  group: mutants-frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The whole of src/lib takes about 30 minutes here, testing 4 mutants at
    # once, one for each of the runner's cores.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      # The old report goes first, so the steps below never read one this run
      # didn't write.
      - name: Test the mutants
        id: stryker
        working-directory: apps/player
        run: |
          rm -rf reports/mutation
          pnpm exec stryker run

      - name: Write the summary
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/stryker-summary.py --title "Frontend mutation testing" \
            apps/player/reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"

      # The HTML report shows each mutant in its source file, and the JSON
      # report is what the summary reads.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-report
          path: apps/player/reports/mutation/
          if-no-files-found: ignore
          retention-days: 30

  # The weekly run starts a manual run on dev, which tests the newest code.
  start:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the full run on dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mutants-frontend.yml --repo "$GITHUB_REPOSITORY" --ref dev
