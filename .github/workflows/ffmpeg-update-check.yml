# Opens an issue when ffmpeg has a release newer than a build that
# scripts/fetch-ffmpeg.sh pins. It compares the script's FFMPEG_VERSION lines
# with the release tags in FFmpeg's git repository. A release gets an issue
# when it's the newest in a pinned series and newer than that pin, as a fix
# release for the series the app ships, or when it's the newest of all and
# newer than every pin. No issue opens when one with the same title exists,
# open or closed, so closing one means it isn't opened again. A pull request
# that changes the script or this workflow runs the same comparison and only
# reports it. The comparison fails when it can't read a version, when the
# script has an FFMPEG_VERSION line it didn't read, or when two lines name the
# same platform, so a pull request that breaks those lines fails there.
name: ffmpeg update check

on:
  pull_request:
    branches: [dev]
    paths:
      - "scripts/fetch-ffmpeg.sh"
      - ".github/workflows/ffmpeg-update-check.yml"
  # Schedules run from the default branch, main, so the job reads the script
  # on dev.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Without a shell named, Actions runs bash without pipefail. Naming bash adds it.
defaults:
  run:
    shell: bash

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.compare.outputs.versions }}
      table: ${{ steps.compare.outputs.table }}
    steps:
      # A pull request reads its own copy of the script, and other runs read
      # the one on dev.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && 'dev' || '' }}
          sparse-checkout: scripts/fetch-ffmpeg.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compare the pinned versions with ffmpeg's releases
        id: compare
        run: |
          # Each platform's case in the script sets FFMPEG_VERSION.
          awk '
            /^  [a-z]+\)$/ { sub(/\)$/, ""); platform = $1 }
            /^ +FFMPEG_VERSION=/ { sub(/^ +FFMPEG_VERSION=/, ""); print platform, $0 }
          ' scripts/fetch-ffmpeg.sh > pins.txt
          if [[ ! -s pins.txt ]] || grep -qvE '^[a-z]+ [0-9]+\.[0-9]+(\.[0-9]+)?$' pins.txt; then
            echo "::error::Couldn't read the FFMPEG_VERSION lines in scripts/fetch-ffmpeg.sh"
            cat pins.txt
            exit 1
          fi
          # A line the awk above skips, such as one indented with a tab, would
          # leave that platform out without an error.
          lines="$(grep -cE '^[[:space:]]*FFMPEG_VERSION=' scripts/fetch-ffmpeg.sh)"
          if [[ "$lines" -ne "$(wc -l < pins.txt)" ]]; then
            echo "::error::scripts/fetch-ffmpeg.sh has $lines FFMPEG_VERSION lines, and only these were read"
            cat pins.txt
            exit 1
          fi
          repeated="$(cut -d' ' -f1 pins.txt | sort | uniq -d)"
          if [[ -n "$repeated" ]]; then
            echo "::error::scripts/fetch-ffmpeg.sh sets FFMPEG_VERSION more than once for $(paste -sd' ' - <<< "$repeated")"
            cat pins.txt
            exit 1
          fi

          # Release tags look like n8.1.3. Tags like n8.2-dev mark where work
          # on a series began, so they're left out.
          git ls-remote --tags --refs https://github.com/FFmpeg/FFmpeg.git 'refs/tags/n*' > tags.txt
          sed -E 's|.*refs/tags/n||' tags.txt | { grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || true; } | sort -V > releases.txt
          newest="$(tail -n 1 releases.txt)"
          if [[ -z "$newest" ]]; then
            echo "::error::Found no ffmpeg release tags"
            exit 1
          fi

          # True when version $1 comes after version $2.
          is_newer() {
            [[ "$1" != "$2" && "$(printf '%s\n' "$1" "$2" | sort -V | tail -n 1)" == "$1" ]]
          }

          : > newer.txt
          {
            echo "| Platform | Pinned | Newest in its series |"
            echo "| --- | --- | --- |"
            while read -r platform version; do
              series="$(cut -d. -f1-2 <<< "$version")"
              latest="$({ grep -E "^${series//./\\.}(\.|$)" releases.txt || true; } | tail -n 1)"
              echo "| $platform | $version | $latest |"
              if [[ -n "$latest" ]] && is_newer "$latest" "$version"; then
                echo "$latest" >> newer.txt
              fi
            done < pins.txt
          } > table.md
          highest="$(cut -d' ' -f2 pins.txt | sort -V | tail -n 1)"
          if is_newer "$newest" "$highest"; then
            echo "$newest" >> newer.txt
          fi
          versions="$(sort -uV newer.txt | paste -sd' ' -)"

          if [[ -n "$versions" ]]; then
            lead="Newer ffmpeg releases than scripts/fetch-ffmpeg.sh pins: $versions."
          else
            lead="scripts/fetch-ffmpeg.sh pins the newest release of each series it uses, and ffmpeg's newest release is $newest."
          fi
          {
            echo "## ffmpeg update check"
            echo
            echo "$lead"
            echo
            cat table.md
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "versions=$versions"
            echo "table<<END_OF_TABLE"
            cat table.md
            echo "END_OF_TABLE"
          } >> "$GITHUB_OUTPUT"

  open-issues:
    needs: compare
    if: github.event_name != 'pull_request' && needs.compare.outputs.versions != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A run started by hand while the Monday one is still going would read the
    # same titles and open the same issues, so the second waits.
    concurrency:
      group: ffmpeg-update-check-issues
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Open an issue for each newer release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSIONS: ${{ needs.compare.outputs.versions }}
          TABLE: ${{ needs.compare.outputs.table }}
        run: |
          gh issue list --state all --limit 1000 --json title --jq '.[].title' > titles.txt
          # One issue that can't be opened doesn't stop the rest.
          failed=0
          for version in $VERSIONS; do
            title="ffmpeg $version is out"
            if grep -Fxq -- "$title" titles.txt; then
              echo "An issue called \"$title\" exists already."
              continue
            fi
            {
              echo "ffmpeg $version is out, and scripts/fetch-ffmpeg.sh pins an older build."
              echo
              printf '%s\n' "$TABLE"
              echo
              echo "docs/development.md says how to move to a new ffmpeg and what to check first."
            } > issue.md
            if ! gh issue create --title "$title" --body-file issue.md; then
              echo "::error::Couldn't open the issue \"$title\""
              failed=1
            fi
          done
          exit "$failed"
