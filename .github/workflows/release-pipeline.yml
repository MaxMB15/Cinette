# One-click release pipeline: dev -> main -> version bump -> tag -> release build.
#
# Replaces the manual 13-step process:
#   1. Waits for Build & Bundle to pass on dev's newest code, and stops if it failed
#   2. Merges dev into main (fast-forward or merge commit)
#   3. Bumps version on main
#   4. Pushes annotated tag vX.Y.Z (triggers release.yml)
#
# release.yml's macOS job then waits for approval in the macos-signing
# environment before it signs and notarizes the app. The run summary links to
# that run. After release.yml completes, its sync-dev job auto-merges main
# back to dev.
#
# Prerequisites:
#   - Secret: RELEASE_AUTOMATION_PAT (fine-grained PAT: Contents + Pull requests RW)
#   - Secret: TAURI_SIGNING_PRIVATE_KEY (for release.yml)
#   - Optional environment: macos-signing with the Apple secrets (docs/macos-signing.md)
#   - Optional var: RELEASE_ALLOWED_ACTORS (comma-separated usernames)
#
# The existing release-bump.yml and release-tag.yml still work as manual fallbacks.

name: Release — one-click pipeline

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semver bump type (see https://semver.org)"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run — show what would happen without pushing"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release permission
        env:
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          ALLOWED_ACTORS: ${{ vars.RELEASE_ALLOWED_ACTORS }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os
          actor = os.environ["ACTOR"]
          owner = os.environ["REPO_OWNER"]
          raw = os.environ.get("ALLOWED_ACTORS", "").strip()
          if raw:
              allowed = [x.strip() for x in raw.split(",") if x.strip()]
          else:
              allowed = [owner]
          if actor not in allowed:
              print(f"::error::User '{actor}' is not allowed to run releases. "
                    f"Allowed: {allowed}. Set repository variable RELEASE_ALLOWED_ACTORS.")
              raise SystemExit(1)
          print(f"OK: {actor} is authorized to release.")
          PY

      - name: Require automation PAT
        env:
          RELEASE_AUTOMATION_PAT: ${{ secrets.RELEASE_AUTOMATION_PAT }}
        run: |
          if [ -z "${RELEASE_AUTOMATION_PAT:-}" ]; then
            echo "::error::RELEASE_AUTOMATION_PAT secret is required."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wait for Build & Bundle to pass on dev
        id: dev
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin dev
          # Pin the commit, so a push to dev while this waits doesn't get
          # released untested.
          DEV_SHA=$(git rev-parse origin/dev)
          echo "sha=$DEV_SHA" >> "$GITHUB_OUTPUT"

          # Build & Bundle doesn't run for pushes that only change the paths it
          # ignores, so find the newest dev commit that changed anything else.
          CODE_SHA=$(git log --first-parent -1 --format=%H "$DEV_SHA" -- . \
            ':(exclude,glob)**/*.md' ':(exclude)LICENSE' \
            ':(exclude,glob).github/workflows/release-*.yml' \
            ':(exclude)docs' ':(exclude).vscode' ':(exclude).idea')
          # Every dev commit from there to DEV_SHA has the same code, so a build
          # of any of them counts. A push of several commits is built only at
          # its last one, which can be a docs-only commit after CODE_SHA.
          CANDIDATES=$(git rev-list --first-parent "$DEV_SHA" "^$CODE_SHA"; echo "$CODE_SHA")
          echo "dev is at ${DEV_SHA:0:7}. Its newest code change is ${CODE_SHA:0:7}."

          # Right after a merge the push build can take a few seconds to appear.
          RUN_ID=""
          for _ in $(seq 1 12); do
            RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
              --branch dev --event push --limit 20 \
              --json headSha,databaseId --jq '.[] | "\(.headSha) \(.databaseId)"')
            for SHA in $CANDIDATES; do
              RUN_ID=$(awk -v sha="$SHA" '$1 == sha { print $2; exit }' <<< "$RUNS")
              [[ -n "$RUN_ID" ]] && break
            done
            [[ -n "$RUN_ID" ]] && break
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Couldn't find a Build & Bundle push run on dev between ${CODE_SHA:0:7} and ${DEV_SHA:0:7}. Check Actions → Build & Bundle."
            exit 1
          fi

          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          while :; do
            # A failed API call just means checking again next time.
            RESULT=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion --jq '"\(.status) \(.conclusion)"') || RESULT="unknown "
            STATUS=${RESULT%% *}
            CONCLUSION=${RESULT#* }
            [[ "$STATUS" == "completed" ]] && break
            echo "Build & Bundle is $STATUS. Checking again in 30 seconds. $URL"
            sleep 30
          done
          # A newer push to dev cancels this build, which also stops the release.
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::Build & Bundle on dev ended with '$CONCLUSION', so nothing was released. $URL"
            exit 1
          fi
          echo "Build & Bundle passed on dev. $URL"

      - name: Merge dev into main
        env:
          DEV_SHA: ${{ steps.dev.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main dev

          # Check that dev is ahead of main
          BEHIND=$(git rev-list --count "origin/main..$DEV_SHA")
          if [ "$BEHIND" = "0" ]; then
            echo "::warning::dev has no new commits over main. Continuing with version bump only."
          fi

          git checkout main
          git reset --hard origin/main

          # Merge the dev commit that passed the build (non-interactive)
          echo "Merging dev (${DEV_SHA:0:7}) into main..."
          git merge "$DEV_SHA" --no-edit -m "Merge branch 'dev' into main for release"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::DRY RUN — would merge dev into main"
            echo "Commits from dev:"
            git log origin/main..HEAD --oneline
          else
            git push origin main
            echo "Pushed merged main."
          fi

      - name: Install Rust (for Cargo.lock refresh)
        uses: dtolnay/rust-toolchain@stable

      - name: Bump version
        id: ver
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          CURRENT=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          export CURRENT
          NEW=$(python3 - <<'PY'
          import os
          cur = os.environ["CURRENT"]
          rt = os.environ["RELEASE_TYPE"]
          major, minor, patch = map(int, cur.split("."))
          if rt == "patch":
              print(f"{major}.{minor}.{patch + 1}")
          elif rt == "minor":
              print(f"{major}.{minor + 1}.0")
          elif rt == "major":
              print(f"{major + 1}.0.0")
          else:
              raise SystemExit(1)
          PY
          )
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEW ($RELEASE_TYPE)"
          python3 scripts/bump-version.py "$NEW"

      - name: Refresh Cargo.lock
        run: cargo generate-lockfile

      - name: Commit version bump
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          git add apps/desktop/src-tauri/tauri.conf.json \
                  apps/desktop/src-tauri/Cargo.toml \
                  Cargo.lock
          git commit -m "chore: bump version to $NEW"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::DRY RUN — would commit and push version bump"
          else
            git push origin main
            echo "Pushed version bump to main."
          fi

      - name: Create and push tag
        id: tag
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          TAG="v${NEW}"

          # Check tag doesn't already exist
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists on remote. Delete it first or use a different version."
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::DRY RUN — would push tag $TAG (triggers release.yml)"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            git push origin "$TAG"
            echo "Pushed tag $TAG — release.yml will now build and publish."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the release run
        id: release_run
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The tag push starts release.yml. Link its run in the summary, since
          # its macOS job waits there for approval.
          for _ in $(seq 1 12); do
            URL=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
              --branch "$TAG" --limit 1 --json url --jq '.[0].url // empty')
            if [[ -n "$URL" ]]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The release run for $TAG hasn't appeared yet. Find it under Actions → Release."

      - name: Summary
        env:
          NEW: ${{ steps.ver.outputs.new }}
          CURRENT: ${{ steps.ver.outputs.current }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ steps.release_run.outputs.url }}
          DEV_SHA: ${{ steps.dev.outputs.sha }}
          RELEASE_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Dry run complete" >> "$GITHUB_STEP_SUMMARY"
            echo "Build & Bundle passed on \`dev\` (\`${DEV_SHA:0:7}\`). Would have:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release pipeline complete" >> "$GITHUB_STEP_SUMMARY"
            echo "Build & Bundle passed on \`dev\` (\`${DEV_SHA:0:7}\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Merged \`dev\` into \`main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bumped version: \`$CURRENT\` -> \`$NEW\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pushed tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" != "true" ]; then
            {
              echo ""
              echo "**Next:**"
              echo "1. Open [the release run](${RUN_URL:-$RELEASE_WORKFLOW_URL}) and approve the macOS job: **Review deployments**, tick \`macos-signing\`, **Approve and deploy**. It signs and notarizes the app."
              echo "2. When the run finishes, publish the draft release \`$TAG\`. The run also merges \`main\` back into \`dev\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
