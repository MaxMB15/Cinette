name: Build & Bundle

on:
  push:
    branches: [main, dev, release-*]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/workflows/release-*.yml"
      - "docs/**"
      - ".vscode/**"
      - ".idea/**"
  # Pull requests always run, even docs-only ones, because the ruleset requires
  # `test` and `build-macos`. detect-changes skips the platform builds when no
  # platform files changed, and a skipped job still counts as passing.
  pull_request:
    branches: [main, dev, release-*]
  # A manual run builds only macOS, for both CPUs, signed and notarized when the
  # Apple secrets are set, so signing can be tested without making a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep a manual run from cancelling, or being cancelled by, a push build.
  group: build-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Test builds keep line numbers for backtraces but drop the rest of the debug
  # info, which is most of their size in the Rust caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # ── Enforce merge source for PRs targeting main ─────────────────────────
  # Only dev and release automation branches may merge into main.
  check-merge-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD" == "dev" || "$HEAD" == chore-bump-v* || "$HEAD" == chore/release-* || "$HEAD" == chore/sync-main-* ]]; then
            echo "OK: '$HEAD' is allowed to merge into main."
          else
            echo "::error::Branch '$HEAD' is not allowed to merge into main. Only dev and release automation branches can target main."
            exit 1
          fi

  # ── Detect which platform-specific files changed ─────────────────────────
  # On PRs: uses dorny/paths-filter to check changed files.
  # On push: outputs 'true' for both so builds always run.
  # On manual runs: macOS only.
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      linux: ${{ steps.push-all.outputs.linux || steps.filter.outputs.linux }}
      macos: ${{ steps.push-all.outputs.macos || steps.manual.outputs.macos || steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push — always build both platforms
        id: push-all
        if: github.event_name == 'push'
        run: |
          echo "linux=true" >> "$GITHUB_OUTPUT"
          echo "macos=true" >> "$GITHUB_OUTPUT"

      - name: Manual run — build macOS only
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "macos=true" >> "$GITHUB_OUTPUT"

      - name: PR — detect changed paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # The whole plugin crate counts, because a list of its files missed
          # new ones. Both builds also run when CI itself changes.
          filters: |
            shared: &shared
              - 'crates/tauri-plugin-mpv/**'
              - 'crates/core/**'
              - 'apps/player/src-tauri/**'
              - 'apps/player/src/**'
              - 'apps/player/*'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/config*'
              - 'scripts/build-app.sh'
              - 'scripts/build-libmpv.sh'
              - 'scripts/fetch-ffmpeg.sh'
              - '.github/actions/setup-frontend/**'
              - '.github/workflows/build.yml'
            linux:
              - *shared
              - 'scripts/bundle-libmpv-linux.sh'
              - '.github/actions/install-linux-deps/**'
            macos:
              - *shared
              - 'scripts/bundle-libmpv.sh'
              - 'scripts/smoke-test-macos-app.sh'
              - '.github/actions/install-macos-deps/**'
              - '.github/actions/macos-signing/**'

  # ── Tests (run on every push and PR) ────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          # Only branch pushes save. A PR's caches can only be used by that PR, and
          # its three jobs add ~1.7 GB against the repo's 10 GB limit, which was
          # evicting the dev and main caches that PRs restore from.
          save-if: ${{ github.event_name == 'push' }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: TypeScript type-check
        working-directory: apps/player
        run: pnpm exec tsc -b --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      # Clippy type-checks too, and any warning fails the job.
      - name: Lint mvp-core with Clippy
        run: cargo clippy --locked -p mvp-core --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked -p mvp-core -- --include-ignored

      - name: Run desktop tests with coverage
        working-directory: apps/player
        run: pnpm run test:coverage

      - name: Upload coverage artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: apps/player/coverage/
          retention-days: 1

  # ── Coverage badge deploy (push to main only, needs write) ─────────────
  # The frontend report goes to coverage/ and the Rust report to coverage/rust/.
  # The Rust report comes from build-linux. If that job made no report, the
  # frontend report still goes up and the last Rust report stays.
  deploy-coverage:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success' }}
    needs: [test, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      - name: Download the Rust coverage report
        id: rust
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-coverage-report
          path: coverage/rust

      - name: Generate frontend coverage badge
        uses: jaywcjlove/coverage-badges-cli@998665f7962b1a3935ba8c3e786171a99436e5d1 # v2.3.0
        with:
          source: coverage/coverage-summary.json
          output: coverage/badge.svg
          label: frontend coverage

      - name: Generate Rust coverage badge
        if: steps.rust.outcome == 'success'
        uses: jaywcjlove/coverage-badges-cli@998665f7962b1a3935ba8c3e786171a99436e5d1 # v2.3.0
        with:
          source: coverage/rust/coverage-summary.json
          output: coverage/rust/badge.svg
          label: Rust coverage

      - name: Deploy coverage to gh-pages
        id: publish
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage
          destination_dir: coverage
          keep_files: true

      # site.yml's deploy can push to gh-pages at the same moment, which rejects
      # the later push and would fail the gate below. Trying again starts from
      # the new branch. The two jobs don't share a concurrency group, because a
      # cancelled pending job would fail the gate too.
      - name: Wait for the other push
        if: steps.publish.outcome == 'failure'
        run: sleep 30

      - name: Deploy coverage to gh-pages again
        if: steps.publish.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage
          destination_dir: coverage
          keep_files: true

  # ── macOS Desktop (push, or PRs with macOS-relevant changes) ─────────────
  # Skip platform builds on version-bump PRs (only version numbers change).
  build-macos:
    if: needs.detect-changes.outputs.macos == 'true' && !startsWith(github.head_ref, 'chore-bump-v')
    needs: [test, detect-changes]
    # Pinned: the bundle ships Homebrew dylibs, which require the runner's macOS
    # version. macos-latest moved to macOS 26 and v0.5.0 stopped launching on 15.
    runs-on: macos-15
    # Manual runs sign, so they use the environment that holds the Apple
    # secrets and wait for approval. Push and PR builds use no environment.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'macos-signing' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          # Shared with release.yml, which restores it from main.
          shared-key: desktop-macos
          save-if: ${{ github.event_name == 'push' }}

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install system deps
        uses: ./.github/actions/install-macos-deps

      - name: Prepare libmpv for bundle
        run: ./scripts/build-libmpv.sh macos

      - name: Fetch ffmpeg sidecar (used for offline downloads)
        # Fails when the pinned build doesn't download, as the release would.
        env:
          FFMPEG_PINNED_ONLY: "1"
        run: ./scripts/fetch-ffmpeg.sh macos

      - name: Build frontend
        run: pnpm run build:desktop

      # Runs after the frontend build and the sidecar fetch, which the app's
      # build script needs. This is the only job that checks macos.rs.
      - name: Lint the workspace with Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Set up Developer ID signing
        id: apple
        # Only manual runs sign, so push and PR builds don't wait on Apple.
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Build Tauri app (macOS)
        # Builds without updater artifacts, which only the release workflow
        # makes, and tries a failed build once more. The script says why.
        run: ./scripts/build-app.sh

      - name: Start the app
        run: ./scripts/smoke-test-macos-app.sh target/release/bundle/macos/*.app

      - name: Notarize the DMG
        if: steps.apple.outputs.notarizing == 'true'
        run: ./scripts/notarize-macos.sh target/release/bundle/dmg/*.dmg

      - name: Verify signing
        if: steps.apple.outputs.signing == 'true'
        run: >-
          ./scripts/verify-macos-signing.sh
          ${{ steps.apple.outputs.notarizing == 'true' && '--notarized' || '' }}
          target/release/bundle/macos/*.app target/release/bundle/dmg/*.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cinette-macOS
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error

  # ── macOS Desktop on Intel (same trigger as build-macos) ────────────────
  # A job of its own, not a matrix leg, because rulesets require build-macos
  # by name. Homebrew stopped building bottles for Intel Macs, so this job's
  # libraries come from MacPorts. Clippy runs in build-macos only, since the
  # code is the same for both CPUs.
  build-macos-intel:
    if: needs.detect-changes.outputs.macos == 'true' && !startsWith(github.head_ref, 'chore-bump-v')
    needs: [test, detect-changes]
    # macOS 15 for the same reason as build-macos. GitHub's last Intel image.
    runs-on: macos-15-intel
    environment: ${{ github.event_name == 'workflow_dispatch' && 'macos-signing' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          # Shared with release.yml, which restores it from main.
          shared-key: desktop-macos-x64
          save-if: ${{ github.event_name == 'push' }}

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install system deps
        uses: ./.github/actions/install-macos-deps

      - name: Prepare libmpv for bundle
        run: ./scripts/build-libmpv.sh macos

      # Plays short test files through the libmpv built from MacPorts'
      # libraries, which no other job uses.
      - name: Test the plugin
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/libs/macos
        run: cargo test --locked -p tauri-plugin-mpv

      - name: Fetch ffmpeg sidecar (used for offline downloads)
        # Fails when the pinned build doesn't download, as the release would.
        env:
          FFMPEG_PINNED_ONLY: "1"
        run: ./scripts/fetch-ffmpeg.sh macos

      - name: Build frontend
        run: pnpm run build:desktop

      - name: Set up Developer ID signing
        id: apple
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Build Tauri app (macOS)
        run: ./scripts/build-app.sh

      - name: Start the app
        run: ./scripts/smoke-test-macos-app.sh target/release/bundle/macos/*.app

      - name: Notarize the DMG
        if: steps.apple.outputs.notarizing == 'true'
        run: ./scripts/notarize-macos.sh target/release/bundle/dmg/*.dmg

      - name: Verify signing
        if: steps.apple.outputs.signing == 'true'
        run: >-
          ./scripts/verify-macos-signing.sh
          ${{ steps.apple.outputs.notarizing == 'true' && '--notarized' || '' }}
          target/release/bundle/macos/*.app target/release/bundle/dmg/*.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cinette-macOS-Intel
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error

  # ── Linux Desktop (push, or PRs with Linux-relevant changes) ────────────
  build-linux:
    if: needs.detect-changes.outputs.linux == 'true' && !startsWith(github.head_ref, 'chore-bump-v')
    needs: [test, detect-changes]
    # Same Ubuntu as release-linux in release.yml, so this builds what ships, and
    # the Rust cache the two jobs share comes from one system.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          # cargo-llvm-cov reads the coverage data with LLVM's tools.
          components: llvm-tools, clippy

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          # Shared with release.yml, which restores it from main.
          shared-key: desktop-linux
          save-if: ${{ github.event_name == 'push' }}

      - name: Install system deps
        uses: ./.github/actions/install-linux-deps

      - name: Build libmpv from source
        run: |
          ./scripts/build-libmpv.sh linux
          echo "LD_LIBRARY_PATH=$(pwd)/libs/linux:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Fetch ffmpeg sidecar (used for offline downloads)
        # Fails when the pinned build doesn't download, as the release would.
        env:
          FFMPEG_PINNED_ONLY: "1"
        run: ./scripts/fetch-ffmpeg.sh linux

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Build frontend
        run: pnpm run build:desktop

      # Checks linux.rs and the plugin and app code that only builds here.
      - name: Lint the workspace with Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The test job covers only mvp-core. The plugin and the app need GTK and
      # libmpv, which this job installs, so the whole workspace's tests run here
      # and measure Rust coverage. The figure counts linux.rs and not macos.rs,
      # since each builds only on its own platform.
      - name: Run Rust tests with coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --workspace --no-report
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --html --output-dir target/rust-coverage
          cargo llvm-cov report --json --summary-only --output-path target/rust-coverage/summary.json
          mv target/rust-coverage/html rust-coverage
          # The badge reads the summary format the frontend report writes,
          # with the percentage rounded to two places as that one is.
          jq '{total: {lines: {pct: (.data[0].totals.lines.percent * 100 | round / 100)}}}' \
            target/rust-coverage/summary.json > rust-coverage/coverage-summary.json
          echo "Rust line coverage: $(jq .total.lines.pct rust-coverage/coverage-summary.json)%" >> "$GITHUB_STEP_SUMMARY"

      # Runs after the summary is written, so a failing run still shows the figure.
      - name: Check Rust coverage is at least 80%
        run: |
          set -euo pipefail
          pct=$(jq .total.lines.pct rust-coverage/coverage-summary.json)
          if ! jq -e '.total.lines.pct >= 80' rust-coverage/coverage-summary.json > /dev/null; then
            echo "::error::Rust line coverage is ${pct}%, below the 80% minimum."
            exit 1
          fi

      - name: Upload Rust coverage artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-report
          path: rust-coverage/
          retention-days: 1

      - name: Build Tauri app (Linux)
        run: ./scripts/build-app.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cinette-Linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ── Plugin tests on the distro libmpv (same trigger as build-linux) ────
  # The .deb uses the system libmpv, which is mpv 0.35 on Debian 12 and 0.37 on
  # Ubuntu 24.04. build-linux tests against the mpv 0.40 it builds, so this runs
  # the plugin's tests against those two as well. Only the plugin calls libmpv.
  test-system-libmpv:
    name: test-system-libmpv (${{ matrix.image }})
    if: needs.detect-changes.outputs.linux == 'true' && !startsWith(github.head_ref, 'chore-bump-v')
    needs: detect-changes
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Before checkout, which needs git to clone.
      - name: Install system deps
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libmpv-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libegl-dev libwayland-dev libssl-dev
          echo "libmpv from the distro: mpv $(pkg-config --modversion mpv)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Test the plugin
        run: cargo test --locked -p tauri-plugin-mpv

  # ── Overall result ──────────────────────────────────────────────────────
  # One check that sums up the whole run, so a ruleset can require it instead
  # of each job. A skipped job is fine, but a failed or cancelled one isn't,
  # including detect-changes, whose failure would otherwise skip the builds.
  ci-status:
    if: always()
    needs:
      - check-merge-source
      - detect-changes
      - test
      - deploy-coverage
      - build-macos
      - build-macos-intel
      - build-linux
      - test-system-libmpv
    runs-on: ubuntu-latest
    steps:
      - name: Check the other jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
