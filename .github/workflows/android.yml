name: Android

# Builds a debug APK for 64-bit and 32-bit ARM, with libmpv and FFmpeg from
# scripts/build-libmpv.sh android, once for Google's store and once for
# Amazon's. Nothing is signed or uploaded; this catches changes that break
# the Android build.
on:
  push:
    branches: [main, dev]
    paths:
      - "apps/player/**"
      - "crates/**"
      - ".cargo/config*"
      - ".github/actions/setup-frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-libmpv.sh"
      - "scripts/lib/libmpv-android.sh"
      - "scripts/android-env.sh"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/player/**"
      - "crates/**"
      - ".cargo/config*"
      - ".github/actions/setup-frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-libmpv.sh"
      - "scripts/lib/libmpv-android.sh"
      - "scripts/android-env.sh"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The NDK docs/android.md names. The runner's SDK has its own, which can
  # change under the build.
  NDK_VERSION: 30.0.16248370

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: android
          # Pull requests restore from dev. Only dev saves, since a copy saved
          # from main would only take up room in the 10 GB cache.
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # The runner comes with the Android SDK. This adds the NDK version above.
      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # libmpv and FFmpeg take a while to build, so they're cached. The
      # script pins every source, so it and the NDK make the key.
      - name: Restore libmpv for Android
        id: libmpv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/android
          key: libmpv-android-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-libmpv.sh', 'scripts/lib/libmpv-android.sh') }}

      - name: Build libmpv for Android
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
          ./scripts/build-libmpv.sh android
          rm -rf libs/android-build

      - name: Save libmpv for Android
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/android
          key: ${{ steps.libmpv-cache.outputs.cache-primary-key }}

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      # Builds the frontend, the Rust library for both ABIs and the Gradle
      # project.
      # libmpv2-sys generates its armv7 bindings with the NDK's libclang.
      # This shows the settings android-env.sh makes for it and builds just
      # that crate, so a problem there shows up with its own output.
      - name: Check the armv7 mpv bindings
        run: |
          set -o pipefail
          . scripts/android-env.sh
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          echo "CLANG_PATH=$CLANG_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=$BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi"
          ls "$LIBCLANG_PATH"/libclang*
          cargo build --locked -vv -p libmpv2-sys --target armv7-linux-androideabi 2>&1 | grep -vE '^\s+(Fresh|Compiling)' | tail -40

      # android-env.sh sets what bindgen needs for armv7. The Google build
      # comes first. The Amazon one only differs in the store property that
      # app/build.gradle.kts reads, so cargo has nothing left to build for it.
      - name: Build the APKs
        working-directory: apps/player
        run: |
          . ../../scripts/android-env.sh
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/debug
          for store in google amazon; do
            ORG_GRADLE_PROJECT_store="$store" pnpm tauri android build --debug --target aarch64 --target armv7 --apk --ci
            mv "$OUT/app-universal-debug.apk" "$RUNNER_TEMP/app-$store-debug.apk"
          done

      - name: Check the APKs
        run: |
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          for store in google amazon; do
            APK="$RUNNER_TEMP/app-$store-debug.apk"
            echo "::group::$store"
            test -f "$APK"
            for abi in arm64-v8a armeabi-v7a; do
              for lib in max_video_player_lib mpv avcodec avformat avutil; do
                unzip -l "$APK" | grep "lib/$abi/lib$lib.so"
              done
            done
            BADGING="$RUNNER_TEMP/badging-$store.txt"
            "$AAPT2" dump badging "$APK" > "$BADGING"
            cat "$BADGING"
            # minSdk is set in app/build.gradle.kts. aapt2 from build-tools 34
            # and older calls the line sdkVersion.
            if ! grep -Eq "^(minSdkVersion|sdkVersion):'28'$" "$BADGING"; then
              echo "::error::The $store APK's minimum SDK isn't 28"
              exit 1
            fi
            if ! grep -q "^leanback-launchable-activity:" "$BADGING"; then
              echo "::error::The $store APK has no TV launcher activity"
              exit 1
            fi
            # Fire TV's launcher shows the activity's icon, not the banner, for
            # an app that didn't come from the Appstore, so the Amazon build
            # gives it the wide banner. See launcherIcon in app/build.gradle.kts.
            ACTIVITY=$(grep "^leanback-launchable-activity:" "$BADGING")
            if [ "$store" = amazon ] && ! grep -q "icon='[^']*/banner.png'" <<< "$ACTIVITY"; then
              echo "::error::The amazon APK's launcher activity doesn't use the banner as its icon"
              exit 1
            fi
            if [ "$store" = google ] && grep -q "icon='[^']*/banner.png'" <<< "$ACTIVITY"; then
              echo "::error::The google APK's launcher activity uses the banner as its icon"
              exit 1
            fi
            # Both stores hide an app from every device that lacks a feature
            # it requires, including one a permission implies, like Wi-Fi.
            if grep -E "^\s*uses-feature:" "$BADGING"; then
              echo "::error::The $store APK requires the features above, which hides it from TVs without them"
              exit 1
            fi
            # android_device.rs reads the store from this meta-data.
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest-$store.txt"
            if ! grep -A1 'A: http://schemas.android.com/apk/res/android:name(0x01010003)="app.cinette.STORE"' "$RUNNER_TEMP/manifest-$store.txt" \
              | grep -q "android:value(0x01010024)=\"$store\""; then
              grep -A1 "app.cinette.STORE" "$RUNNER_TEMP/manifest-$store.txt" || true
              echo "::error::The $store APK's manifest doesn't say app.cinette.STORE=$store"
              exit 1
            fi
            echo "::endgroup::"
          done

      # The build above shows warnings without failing. This lints the
      # workspace for both Android targets, including the code that only
      # builds there, and fails on any warning.
      - name: Lint the workspace for Android with Clippy
        run: |
          . scripts/android-env.sh
          for target in aarch64-linux-android armv7-linux-androideabi; do
            cargo clippy --locked --workspace --target "$target" --all-targets -- -D warnings
          done
