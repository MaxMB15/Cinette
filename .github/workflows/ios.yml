name: iOS

# Builds the app for the iOS simulator. Nothing is signed or uploaded; this
# catches changes that break the iOS build before they reach a release.
on:
  push:
    branches: [main, dev]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - ".cargo/**"
      - ".github/actions/install-frontend-deps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - ".cargo/**"
      - ".github/actions/install-frontend-deps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-simulator:
    # macOS 26 ships Xcode 26 and the iOS 26 SDK, which App Store uploads need.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: ios-sim
          # Pull requests restore from dev. Only dev saves, since a copy saved
          # from main would only take up room in the 10 GB cache.
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install frontend deps
        uses: ./.github/actions/install-frontend-deps

      - name: Show Xcode version
        run: xcodebuild -version

      # Builds the frontend, the Rust library and the Xcode project, which
      # pulls MPVKit through Swift Package Manager.
      - name: Build for the simulator
        working-directory: apps/desktop
        run: npx tauri ios build --debug --target aarch64-sim --ci

      - name: Check the app bundle
        run: |
          APP="apps/desktop/src-tauri/gen/apple/build/arm64-sim/Max Video Player.app"
          test -d "$APP"
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|MinimumOSVersion|CFBundleShortVersionString'

      # The build above shows warnings without failing. This lints the
      # workspace for the iOS target, including the code that only builds
      # there, and fails on any warning.
      - name: Lint the workspace for iOS with Clippy
        run: cargo clippy --locked --workspace --target aarch64-apple-ios-sim --all-targets -- -D warnings
