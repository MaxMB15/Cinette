# Weekly dependency updates. Pull requests go to dev, since main only takes
# merges from dev. Minor and patch updates come grouped into one pull request
# per ecosystem, and each major update comes on its own. A release has to be a
# week old before Dependabot offers it, so a bad one has time to be pulled.
#
# Dependabot reads this file from main, the default branch, so a change here
# takes effect once it reaches main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node follows the Node major that CI runs, set in
      # .github/actions/setup-frontend. Move both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Tauri's CLI refuses to build when @tauri-apps/api and the tauri crate
      # differ by a minor version, so Tauri's packages come in a pull request
      # of their own, majors included. Each one fails the build alone, so
      # combine it with the Cargo tauri pull request before merging.
      tauri:
        patterns: ["@tauri-apps/*"]
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  # The actions are pinned to commits, with the version in a comment, and
  # Dependabot moves both. The composite actions need their folders listed.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    target-branch: dev
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
