[package]
name = "max-video-player"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
mvp-core = { path = "../../../crates/core" }
tauri-plugin-mpv = { path = "../../../crates/tauri-plugin-mpv" }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { workspace = true, features = ["json", "stream"] }
futures-util = "0.3"
tempfile = "3"

[dev-dependencies]
# The mock runtime, so tests can build an app and call commands without a window.
tauri = { version = "2", features = ["test"] }
# The local HTTP servers from mvp-core's own tests.
mvp-core = { path = "../../../crates/core", features = ["test-util"] }
# A second connection to a test's cache, so a test can break it in ways the
# app never does. The same version and features as mvp-core's.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The D-Bus library tauri-plugin-single-instance uses. Its address parser
# decides whether that plugin can start on Linux.
zbus = "5"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = { version = "0.2", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[lib]
name = "max_video_player_lib"
# The desktop binary links the rlib and iOS links the staticlib. A cdylib
# can't link on iOS because libmpv comes from MPVKit in the Xcode project,
# not from a library cargo can find. Android will need "cdylib" back.
crate-type = ["staticlib", "rlib"]
