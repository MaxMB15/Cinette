name: max-video-player
options:
  bundleIdPrefix: app.cinette
  deploymentTarget:
    iOS: 17.5
fileGroups: [../../src]
configs:
  debug: debug
  release: release
packages:
  # The LGPL build of mpv and FFmpeg. Never switch to the MPVKit-GPL product:
  # the App Store build can't contain anyone else's GPL code.
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
settingGroups:
  app:
    base:
      PRODUCT_NAME: Cinette
      PRODUCT_BUNDLE_IDENTIFIER: app.cinette
      DEVELOPMENT_TEAM: 3MLC4VWP96
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  max-video-player_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The HLS converter's C, built against MPVKit's FFmpeg. The Rust in
      # crates/hls-remux calls it.
      - path: ../../../../../crates/hls-remux/native
        name: native
      - path: Assets.xcassets
      - path: Externals
      - path: max-video-player_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: max-video-player_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        # Audio keeps playing on the lock screen.
        UIBackgroundModes: [audio]
        # The only encryption is HTTPS and TLS, which is exempt. Without this
        # key App Store Connect asks about it for every build.
        ITSAppUsesNonExemptEncryption: false
        # Channel logos are often plain HTTP. mpv and reqwest open their own
        # sockets, which App Transport Security doesn't cover. AVPlayer does
        # go through it, and AirPlay hands it the provider's stream URL,
        # which is usually plain HTTP, so media loads are allowed too.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        # iOS asks before the app reaches the local network, such as a
        # provider on a home server or a TV, and shows this text.
        NSLocalNetworkUsageDescription: Cinette uses your local network to reach IPTV servers, to find TVs and other devices running Cinette, and to send video to them.
        # The DNS-SD services the app browses and advertises. iOS only lets
        # it use the ones listed: other Cinette devices. Cast receivers
        # (_googlecast._tcp) join when the iOS app looks for them.
        NSBonjourServices:
          - _cinette._tcp
        # The app is always dark, so the launch screen, the keyboard and system
        # sheets use dark colors too.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.8.0
        CFBundleVersion: "0.8.0"
    entitlements:
      path: max-video-player_iOS/max-video-player_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        CLANG_CXX_LIBRARY: libc++
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      # libmpv and its libraries, for the mpv_* symbols libmpv2 calls.
      - package: MPVKit
        product: MPVKit
      - sdk: AVFoundation.framework
      # AVRoutePickerView and AVRouteDetector, for AirPlay.
      - sdk: AVKit.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: MediaPlayer.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: VideoToolbox.framework
      - sdk: WebKit.framework
      - sdk: libiconv.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libc++.tbd
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a