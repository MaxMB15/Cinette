[package]
name = "max-video-player"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "sync", "time"] }
tracing = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
mvp-core = { path = "../../../crates/core" }
tauri-plugin-mpv = { path = "../../../crates/tauri-plugin-mpv" }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { workspace = true, features = ["json", "stream"] }
futures-util = "0.3"
tempfile = "3"

[dev-dependencies]
# The mock runtime, so tests can build an app and call commands without a window.
tauri = { version = "2", features = ["test"] }
# The local HTTP servers from mvp-core's own tests.
mvp-core = { path = "../../../crates/core", features = ["test-util"] }
# A second connection to a test's cache, so a test can break it in ways the
# app never does. The same version and features as mvp-core's.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The D-Bus library tauri-plugin-single-instance uses. Its address parser
# decides whether that plugin can start on Linux.
zbus = "5"
# DNS-SD for Cinette devices and Cast receivers, without needing Avahi.
mdns-sd = { version = "0.21", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# poll and the socket types for Bonjour's dns_sd.h.
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = { version = "0.2", default-features = false }
# Converts streams for AirPlay. Xcode builds its C against MPVKit's FFmpeg.
hls-remux = { path = "../../../crates/hls-remux" }
# getifaddrs, for this device's Wi-Fi address.
libc = "0.2"

# The HLS converter's tests build its C against the system's FFmpeg. The
# Linux app itself never links it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
hls-remux = { path = "../../../crates/hls-remux", features = ["test-media"] }

[target.'cfg(target_os = "android")'.dependencies]
# Hand Android's JVM to the certificate verifier that rustls uses there. See
# android_tls.rs. The same versions as rustls-platform-verifier's and tao's.
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"
rustls-platform-verifier = "0.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The folders Tauri names after the identifier, found before the app is built.
# The same version as Tauri's.
dirs = "7"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[lib]
name = "max_video_player_lib"
# The desktop binary links the rlib, iOS links the staticlib and Android
# loads the cdylib. On iOS the cdylib is left unused, and build.rs lets it
# link without libmpv, which comes from MPVKit in the Xcode project.
crate-type = ["staticlib", "cdylib", "rlib"]
