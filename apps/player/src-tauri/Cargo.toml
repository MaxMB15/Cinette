[package]
name = "max-video-player"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "sync", "time"] }
tracing = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
mvp-core = { path = "../../../crates/core" }
tauri-plugin-mpv = { path = "../../../crates/tauri-plugin-mpv" }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { workspace = true, features = ["json", "stream"] }
futures-util = "0.3"
tempfile = "3"
# The errors the converter's server tells apart when an accept fails.
libc = "0.2"
# Reads the logo addresses other Cinette devices send. The same version as mvp-core's.
url = "2"
# Clears the logins of providers sent between devices from memory. The same
# version as mvp-core's.
zeroize = "1"

[dev-dependencies]
# The mock runtime, so tests can build an app and call commands without a window.
tauri = { version = "2", features = ["test"] }
# The local HTTP servers from mvp-core's own tests.
mvp-core = { path = "../../../crates/core", features = ["test-util"] }
# A second connection to a test's cache, so a test can break it in ways the
# app never does. The same version and features as mvp-core's.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
# A paused clock, for the AirPlay conversions' timeouts.
tokio = { workspace = true, features = ["test-util"] }
# Self-signed certificates for the fake Cast receivers in tests.
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
# Reads the iOS Info.plist files, to check what a build makes of them.
plist = { version = "1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The D-Bus library tauri-plugin-single-instance uses. Its address parser
# decides whether that plugin can start on Linux.
zbus = "5"
# DNS-SD for Cinette devices and Cast receivers, without needing Avahi.
mdns-sd = { version = "0.21", default-features = false }
# The interfaces' subnets, so remote control only takes local peers, and
# the one that holds the default route, to tell when a VPN does. The same
# version as mdns-sd's.
if-addrs = "0.15"
# The remote-control listener's dual-stack socket. The same version as tokio's.
socket2 = "0.6"
# TLS to Cast receivers. The same rustls and ring that reqwest already
# builds for Tauri.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "macos")'.dependencies]
# poll and the socket types for Bonjour's dns_sd.h.
libc = "0.2"
# The interfaces' subnets, so remote control only takes local peers, and
# the one that holds the default route, to tell when a VPN does.
if-addrs = "0.15"
# The remote-control listener's dual-stack socket. The same version as tokio's.
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The computer name, the default device name for remote control. The same
# version as security-framework's.
core-foundation = "0.10"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = { version = "0.2", default-features = false }
# Converts streams for AirPlay. Xcode builds its C against MPVKit's FFmpeg.
hls-remux = { path = "../../../crates/hls-remux" }
# getifaddrs, for this device's Wi-Fi address.
libc = "0.2"
# Remote control, as on macOS: the interfaces' subnets for the local-peer
# check and the dual-stack listener. The device key is kept in the Keychain.
# The same versions as mdns-sd's, tokio's and native-tls's.
if-addrs = "0.15"
socket2 = "0.6"
security-framework = "3"
core-foundation = "0.10"

# The HLS converter's tests build its C against the system's FFmpeg. The
# Linux app itself never links it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
hls-remux = { path = "../../../crates/hls-remux", features = ["test-media"] }

[target.'cfg(target_os = "android")'.dependencies]
# Hand Android's JVM to the certificate verifier that rustls uses there. See
# android_tls.rs. The same versions as rustls-platform-verifier's and tao's.
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"
rustls-platform-verifier = "0.7"
# Remote control, as on Linux: DNS-SD without a daemon, the interfaces'
# subnets for the local-peer check, the dual-stack listener, and
# CLOCK_BOOTTIME.
mdns-sd = { version = "0.21", default-features = false }
if-addrs = "0.15"
socket2 = "0.6"
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The folders Tauri names after the identifier, found before the app is built.
# The same version as Tauri's.
dirs = "7"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[lib]
name = "max_video_player_lib"
# The desktop binary links the rlib, iOS links the staticlib and Android
# loads the cdylib. On iOS the cdylib is left unused, and build.rs lets it
# link without libmpv, which comes from MPVKit in the Xcode project.
crate-type = ["staticlib", "cdylib", "rlib"]
