[package]
name = "tauri-plugin-mpv"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Tauri v2 plugin for MPV video playback"
links = "tauri-plugin-mpv"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tauri = { version = "2", features = [] }
libmpv2 = { version = "6", features = ["render"] }
# For `mpv_client_api_version`, which libmpv2 doesn't expose. See loadfile.rs.
libmpv2-sys = "4"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSOpenGL",
    "NSOpenGLView",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
# AirPlay through AVPlayer and the route picker. See airplay/macos.rs.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerLayer",
    "AVRouteDetector",
    "objc2-core-media",
    "objc2-quartz-core",
] }
objc2-av-kit = { version = "0.3", default-features = false, features = [
    "std",
    "AVRoutePickerView",
    "objc2-app-kit",
    "objc2-av-foundation",
] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
khronos-egl = { version = "6", features = ["dynamic"] }
gl = "0.14"
gtk = "0.18"
libc = "0.2"
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Fetches the channel logo for the lock screen. See `set_artwork` in ios.rs.
reqwest = { workspace = true, features = ["native-tls-no-alpn"] }

[target.'cfg(target_os = "android")'.dependencies]
# The surface callback from the Kotlin side, and the JVM for libavcodec.
# The same versions as the app's.
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"

# libmpv2-sys's bundled bindings are for 64-bit targets, and their layout
# checks fail on 32-bit ARM, so armv7 generates its own. docs/android.md says
# what bindgen needs.
[target.'cfg(all(target_os = "android", target_pointer_width = "32"))'.dependencies]
libmpv2-sys = { version = "4", features = ["use-bindgen"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
