[default]
description = "Allows all MPV player commands"
permissions = [
    "allow-mpv-load",
    "allow-mpv-play",
    "allow-mpv-pause",
    "allow-mpv-stop",
    "allow-mpv-seek",
    "allow-mpv-set-volume",
    "allow-mpv-set-bounds",
    "allow-mpv-set-visible",
    "allow-mpv-get-state",
    "allow-mpv-sub-add",
    "allow-mpv-sub-remove",
    "allow-mpv-set-sub-delay",
    "allow-mpv-set-media-info",
    "allow-mpv-set-skip-intervals",
]
