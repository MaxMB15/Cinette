[package]
name = "mvp-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Core business logic for Max Video Player"

[features]
# Makes `http::test_server` public, for other crates' tests.
test-util = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", features = ["json", "gzip", "deflate"] }
rayon = "1.10"
memmap2 = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
# fallible_uint reads and writes usize and u64, with an error when a value
# doesn't fit, as rusqlite did by default before 0.33.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
percent-encoding = "2"

[dev-dependencies]
# Folders for tests that write files, removed when the test ends.
tempfile = "3"
