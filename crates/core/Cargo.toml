[package]
name = "mvp-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Core business logic for Cinette"

[features]
# Makes `http::test_server` public, for other crates' tests.
test-util = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["json", "gzip", "deflate", "query"] }
rayon = "1.10"
memmap2 = "0.9"
quick-xml = "0.42"
# fallible_uint reads and writes usize and u64, with an error when a value
# doesn't fit, as rusqlite did by default before 0.38.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
percent-encoding = "2"
# The encrypted remote-control connection (Noise XX). Only the primitives it
# uses are turned on, which leaves out ring and AES.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
# The same hash and curve snow uses, for device ids, the verification code and
# the public half of a saved key.
blake2 = { version = "0.10", default-features = false }
curve25519-dalek = { version = "4.1", default-features = false }
# The converter's unguessable paths.
getrandom = "0.4"
# Clears the logins of providers sent to another device from memory once
# they're saved. Already in the build through the Noise crates.
zeroize = "1"

# reqwest 0.13 switched its default TLS to rustls with aws-lc. Desktop and iOS
# keep 0.12's default, the system's TLS: Security.framework on Apple platforms
# and OpenSSL on Linux. Without ALPN, HTTPS stays on HTTP/1.1 as it did in 0.12.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, features = ["native-tls-no-alpn"] }

# Android has no system OpenSSL. rustls checks certificates with Android's own
# verifier through rustls-platform-verifier, so the system's CAs and, where the
# network security config allows them, the user's CAs are trusted. rustls
# offers HTTP/2 over ALPN, so `http::build` keeps Android on HTTP/1.1 too.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { workspace = true, features = ["rustls"] }

[dev-dependencies]
# Folders for tests that write files, removed when the test ends.
tempfile = "3"
# Captures log lines, so tests can check them.
tracing-subscriber = "0.3"
